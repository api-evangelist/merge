        field_mappings:
          oneOf:
            - $ref: '#/components/schemas/FileFieldMappings'
            - type: 'null'
        remote_data:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/RemoteData'
      description: >-
        # The File Object

        ### Description

        The `File` object is used to represent a file in the workspace. The Object typically exists under a folder or
        drive, if it exists.

        ### Usage Example

        Fetch from the `GET /api/filestorage/v1/files` endpoint and view their files.
