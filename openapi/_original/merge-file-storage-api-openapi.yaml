            This field stores file checksum data. 'type' indicates the algorithm (e.g. crc_32, sha1, sha256, quickXor,
            or md5), and 'content_hash' is the unique hash used to verify file integrity and detect alterations.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        drive:
          type:
            - string
            - 'null'
          format: uuid
          description: The drive that the file belongs to.
        remote_created_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the third party's file was created.
        remote_updated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the third party's file was updated.
