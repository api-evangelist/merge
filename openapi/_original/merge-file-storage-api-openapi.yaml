    RemoteData:
      type: object
      properties:
        path:
          type: string
          description: The third-party API path that is being called.
        data:
          description: The data returned from the third-party for this object in its original, unnormalized format.
      required:
        - path
      description: |-
        # The RemoteData Object
        ### Description
        The `RemoteData` object is used to represent the full data pulled from the third-party API for an object.

        ### Usage Example
        TODO
      title: RemoteData
    Drive:
      type: object
      properties:
        id:
          type: string
          format: uuid
        remote_id:
          type:
            - string
            - 'null'
          description: The third-party API ID of the matching object.
        created_at:
          type: string
          format: date-time
          description: The datetime that this object was created by Merge.
        modified_at:
          type: string
          format: date-time
          description: The datetime that this object was modified by Merge.
        name:
          type:
            - string
            - 'null'
          description: The drive's name.
        remote_created_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the third party's drive was created.
        drive_url:
          type:
            - string
            - 'null'
          description: The drive's url.
        size:
          type:
            - integer
            - 'null'
          format: int64
          description: The drive's size, in bytes.
        remote_was_deleted:
          type: boolean
          description: >-
            Indicates whether or not this object has been deleted in the third party platform. Full coverage deletion
            detection is a premium add-on. Native deletion detection is offered for free with limited coverage. [Learn
            more](https://docs.merge.dev/integrations/hris/supported-features/).
        field_mappings:
          oneOf:
            - $ref: '#/components/schemas/DriveFieldMappings'
            - type: 'null'
        remote_data:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/RemoteData'
      description: |-
        # The Drive Object
        ### Description
        The `Drive` object is used to represent a drive that contains the folders and files in the user's workspace.
        ### Usage Example
        Fetch from the `GET /api/filestorage/v1/drives` endpoint and view their drives.
      title: Drive
    PaginatedDriveList:
      type: object
      properties:
        next:
          type:
            - string
            - 'null'
        previous:
          type:
            - string
            - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Drive'
      title: PaginatedDriveList
    FilesGetParametersExpandSchemaItems:
      type: string
      enum:
        - drive
        - folder
        - permissions
      title: FilesGetParametersExpandSchemaItems
    FilesGetParametersOrderBy:
      type: string
      enum:
        - '-created_at'
        - '-modified_at'
        - created_at
        - modified_at
      title: FilesGetParametersOrderBy
    TypeEnum:
      type: string
      enum:
        - USER
        - GROUP
        - COMPANY
        - ANYONE
      title: TypeEnum
    RolesEnum:
      type: string
      enum:
        - READ
        - WRITE
        - OWNER
      title: RolesEnum
    PermissionFieldMappings:
      type: object
      properties:
        organization_defined_targets:
          type: object
          additionalProperties:
            description: Any type
        linked_account_defined_targets:
          type: object
          additionalProperties:
            description: Any type
      title: PermissionFieldMappings
    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        remote_id:
          type:
            - string
            - 'null'
          description: The third-party API ID of the matching object.
        created_at:
          type: string
          format: date-time
          description: The datetime that this object was created by Merge.
        modified_at:
          type: string
          format: date-time
          description: The datetime that this object was modified by Merge.
        user:
          type:
            - string
            - 'null'
          format: uuid
          description: The user that is granted this permission. This will only be populated if the type is `USER`.
        group:
          type:
            - string
            - 'null'
          format: uuid
          description: The group that is granted this permission. This will only be populated if the type is `GROUP`.
        type:
          oneOf:
            - $ref: '#/components/schemas/TypeEnum'
            - type: 'null'
          description: Denotes what type of people have access to the file.
        roles:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/RolesEnum'
          description: >-
            The permissions that the user or group has for the File or Folder. It is possible for a user or group to
            have multiple roles, such as viewing & uploading. Possible values include: `READ`, `WRITE`, `OWNER`. In
            cases where there is no clear mapping, the original value passed through will be returned.
        remote_was_deleted:
          type: boolean
          description: >-
            Indicates whether or not this object has been deleted in the third party platform. Full coverage deletion
            detection is a premium add-on. Native deletion detection is offered for free with limited coverage. [Learn
            more](https://docs.merge.dev/integrations/hris/supported-features/).
        field_mappings:
          oneOf:
            - $ref: '#/components/schemas/PermissionFieldMappings'
            - type: 'null'
      description: >-
        # The Permission Object

        ### Description

        The Permission object is used to represent a user's or group's access to a File or Folder. Permissions are
        unexpanded by default.


        ### Usage Example

        Fetch from the `GET Files` or `GET Folders` endpoint. Permissions are unexpanded by default. Use the query param
        `expand=permissions` to see more details.
      title: Permission
    FileFieldMappings:
      type: object
      properties:
