openapi: 3.2.0
info:
  title: Agent Handler Subpackage Standard Entity Rules API
  version: 1.0.0
servers:
- url: https://ah-api.merge.dev
tags:
- name: subpackage_standardEntityRules
paths:
  /api/v1/security/standard-entity-rules/:
    get:
      operationId: list-standard-entity-rules
      summary: List standard entity rules
      description: Returns all standard entity rules for the organization.
      tags:
      - subpackage_standardEntityRules
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStandardEntityRuleResponseList'
  /api/v1/security/standard-entity-rules/{entity_type}/:
    get:
      operationId: get-standard-entity-rule
      summary: Get standard entity rule
      description: Retrieve a single standard entity rule by entity type.
      tags:
      - subpackage_standardEntityRules
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEntityRuleResponse'
    put:
      operationId: update-standard-entity-rule
      summary: Update standard entity rule
      description: Update a standard entity rule. All writable fields (is_active, inbound_action, outbound_action) are required.
      tags:
      - subpackage_standardEntityRules
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEntityRuleResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardEntityRulePutInput'
  /api/v1/tool-packs/{tool_pack_id}/standard-entity-rules/:
    get:
      operationId: list-standard-entity-rules-tool-pack
      summary: List standard entity rules (Tool Pack)
      description: Returns standard entity rules for a tool pack, including organization defaults. Tool-pack-level rules take precedence where both exist.
      tags:
      - subpackage_standardEntityRules
      parameters:
      - name: tool_pack_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: defined_at
        in: query
        description: 'Filter by where the rule is defined. Values: ORGANIZATION, TOOL_PACK.'
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicCombinedSecurityRuleList'
  /api/v1/tool-packs/{tool_pack_id}/standard-entity-rules/{entity_type}/:
    get:
      operationId: get-standard-entity-rule-tool-pack
      summary: Get standard entity rule (Tool Pack)
      description: Retrieve a single standard entity rule for a tool pack by entity type.
      tags:
      - subpackage_standardEntityRules
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
      - name: tool_pack_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCombinedSecurityRule'
    put:
      operationId: upsert-standard-entity-rule-override-tool-pack
      summary: Create or update standard entity rule override (Tool Pack)
      description: Create or update a standard entity rule override for a tool pack. All fields required.
      tags:
      - subpackage_standardEntityRules
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
      - name: tool_pack_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCombinedSecurityRule'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardEntityOverridePutInput'
    delete:
      operationId: delete-standard-entity-rule-override-tool-pack
      summary: Delete standard entity rule override (Tool Pack)
      description: Delete a standard entity rule override, reverting to organization defaults.
      tags:
      - subpackage_standardEntityRules
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
      - name: tool_pack_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
components:
