components:
  schemas:
    JournalLineRequest:
      type: object
      properties:
        remote_id:
          type:
          - string
          - 'null'
          description: The third-party API ID of the matching object.
        account:
          type:
          - string
          - 'null'
          format: uuid
        net_amount:
          type:
          - number
          - 'null'
          format: double
          description: The value of the line item including taxes and other fees.
        tracking_category:
          type:
          - string
          - 'null'
          format: uuid
        tracking_categories:
          type: array
          items:
            type: string
            format: uuid
          description: The journal line item's associated tracking categories.
        currency:
          oneOf:
          - $ref: '#/components/schemas/TransactionCurrencyEnum'
          - type: 'null'
          description: The journal line item's currency. The currency code in ISO 4217 format.
        company:
          type:
          - string
          - 'null'
          format: uuid
          description: The company the journal entry belongs to.
        employee:
          type:
          - string
          - 'null'
          format: uuid
        project:
          type:
          - string
          - 'null'
          format: uuid
        contact:
          type:
          - string
          - 'null'
          format: uuid
        tax_rate:
          type:
          - string
          - 'null'
          format: uuid
          description: The tax rate that applies to this line item.
        description:
          type:
          - string
          - 'null'
          description: The line's description.
        exchange_rate:
          type:
          - string
          - 'null'
          format: decimal
          description: The journal line item's exchange rate.
        integration_params:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
        linked_account_params:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
        remote_fields:
          type: array
          items:
            $ref: '#/components/schemas/RemoteFieldRequest'
      description: '# The JournalLine Object

        ### Description

        The `JournalLine` object is used to represent a journal entry''s line items.


        ### Usage Example

        Fetch from the `GET JournalEntry` endpoint and view the journal entry''s line items.'
      title: JournalLineRequest
    ValidationProblemSource:
      type: object
      properties:
        pointer:
          type: string
      required:
      - pointer
      title: ValidationProblemSource
    JournalLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        remote_id:
          type:
          - string
          - 'null'
          description: The third-party API ID of the matching object.
        created_at:
          type: string
          format: date-time
          description: The datetime that this object was created by Merge.
        modified_at:
          type: string
          format: date-time
          description: The datetime that this object was modified by Merge.
        account:
          type:
          - string
          - 'null'
          format: uuid
        net_amount:
          type:
          - number
          - 'null'
          format: double
          description: The value of the line item including taxes and other fees.
        tracking_category:
          type:
          - string
          - 'null'
          format: uuid
        tracking_categories:
          type: array
          items:
            type: string
            format: uuid
          description: The journal line item's associated tracking categories.
        currency:
          oneOf:
          - $ref: '#/components/schemas/TransactionCurrencyEnum'
          - type: 'null'
          description: The journal line item's currency. The currency code in ISO 4217 format.
        company:
          type:
          - string
          - 'null'
          format: uuid
          description: The company the journal entry belongs to.
        employee:
          type:
          - string
          - 'null'
          format: uuid
        project:
          type:
          - string
          - 'null'
          format: uuid
        contact:
          type:
          - string
          - 'null'
          format: uuid
        tax_rate:
          type:
          - string
          - 'null'
          format: uuid
          description: The tax rate that applies to this line item.
        description:
          type:
          - string
          - 'null'
          description: The line's description.
        exchange_rate:
          type:
          - string
          - 'null'
          format: decimal
          description: The journal line item's exchange rate.
        remote_was_deleted:
          type: boolean
          description: Indicates whether or not this object has been deleted in the third party platform. Full coverage deletion detection is a premium add-on. Native deletion detection is offered for free with limited coverage. [Learn more](https://docs.merge.dev/integrations/hris/supported-features/).
        remote_fields:
          type: array
          items:
            $ref: '#/components/schemas/RemoteField'
      description: '# The JournalLine Object

        ### Description

        The `JournalLine` object is used to represent a journal entry''s line items.


        ### Usage Example

        Fetch from the `GET JournalEntry` endpoint and view the journal entry''s line items.'
      title: JournalLine
    ItemTypeEnum:
      type: string
      enum:
      - string
      - number
      - date
