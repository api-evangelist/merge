openapi: 3.1.0
info:
  title: Accounting subpackage_linkToken API
  version: 1.0.0
servers:
- url: https://api.merge.dev/api
- url: https://api-eu.merge.dev/api
- url: https://api-ap.merge.dev/api
tags:
- name: subpackage_linkToken
paths:
  /accounting/v1/link-token:
    post:
      operationId: create
      summary: Create
      description: Creates a link token to be used when linking a new end user. The link token expires after single use.
      tags:
      - subpackage_linkToken
      parameters:
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndUserDetailsRequest'
  /api/v1/registered-users/{registered_user_id}/link-token/:
    post:
      operationId: create-for-registered-user
      summary: Create Link token
      description: Generates a Link Token for a Registered User to authenticate with Connectors. Also returns a magic link URL that can be shared with the user to authenticate in a browser.
      tags:
      - subpackage_linkToken
      parameters:
      - name: registered_user_id
        in: path
        description: Agent Handler ID of the Registered User
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/linkToken_createForRegisteredUser_Response_201'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                connector:
                  type: string
                  description: Slug of the connector to generate a link token for
                external_id:
                  type:
                  - string
                  - 'null'
                  description: Optional external ID to scope the link token to a specific application credential. Use this when you have multiple OAuth apps for the same connector.
                callback_url:
                  type:
                  - string
                  - 'null'
                  description: Optional URL to redirect the user to after they complete the authentication flow. Must be added to your organization's allowed callback origins first.
                state:
                  type:
                  - string
                  - 'null'
                  description: Optional CSRF protection token returned to your callback_url after authentication. Requires callback_url to be set. Do not include a 'state' query parameter in callback_url if using this field.
              required:
              - connector
