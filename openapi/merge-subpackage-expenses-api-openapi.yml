components:
  schemas:
    ValidationProblemSource:
      type: object
      properties:
        pointer:
          type: string
      required:
      - pointer
      title: ValidationProblemSource
    AsyncBulkCreateResponse:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
          description: The ID of the batch.
      required:
      - batch_id
      description: Response serializer for POST bulk create - returns only batch_id
      title: AsyncBulkCreateResponse
    PaginatedExpenseList:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
      title: PaginatedExpenseList
    BatchObjectsResponseStatusEnum:
      type: string
      enum:
      - ENQUEUED
      - IN_PROGRESS
      - PARTIAL_SUCCESS
      - SUCCESS
      - FAILED
      - RATE_LIMITED
      title: BatchObjectsResponseStatusEnum
    ItemTypeEnum:
      type: string
      enum:
      - string
      - number
      - date
      - datetime
      - bool
      - list
      title: ItemTypeEnum
    ExpenseLineRequest:
      type: object
      properties:
        remote_id:
          type:
          - string
          - 'null'
          description: The third-party API ID of the matching object.
        item:
          type:
          - string
          - 'null'
          format: uuid
          description: The line's item.
        net_amount:
          type:
          - number
          - 'null'
          format: double
          description: The line's net amount.
        tracking_category:
          type:
          - string
          - 'null'
          format: uuid
        tracking_categories:
          type: array
          items:
            type: string
            format: uuid
          description: The expense line item's associated tracking categories.
        company:
          type:
          - string
          - 'null'
          format: uuid
          description: The company the expense belongs to.
        employee:
          type:
          - string
          - 'null'
          format: uuid
          description: The employee this overall transaction relates to.
        currency:
          oneOf:
          - $ref: '#/components/schemas/TransactionCurrencyEnum'
          - type: 'null'
          description: The expense line item's currency. The currency code in ISO 4217 format.
        account:
          type:
          - string
          - 'null'
          format: uuid
          description: The expense's payment account.
        contact:
          type:
          - string
          - 'null'
          format: uuid
          description: The expense's contact.
        project:
          type:
          - string
          - 'null'
          format: uuid
        description:
          type:
          - string
          - 'null'
          description: The description of the item that was purchased by the company.
        exchange_rate:
          type:
          - string
          - 'null'
          format: decimal
          description: The expense line item's exchange rate.
        tax_rate:
          type:
          - string
          - 'null'
          format: uuid
          description: The tax rate that applies to this line item.
        quantity:
          type:
          - string
          - 'null'
          format: decimal
          description: Number of items for the expense line.
        unit_price:
          type:
          - string
          - 'null'
          format: decimal
          description: Unit price of the item for the expense line.
        integration_params:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
        linked_account_params:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
        remote_fields:
          type: array
          items:
            $ref: '#/components/schemas/RemoteFieldRequest'
      description: '# The ExpenseLine Object

        ### Description

        The `ExpenseLine` object is used to represent an expense''s line items.


        ### Usage Example

        Fetch from the `GET Expense` endpoint and view the expense''s line items.'
      title: ExpenseLineRequest
    DebugModelLogSummary:
      type: object
      properties:
        url:
          type: string
        method:
          type: string
        status_code:
          type: integer
      required:
      - url
      - method
      - status_code
      title: DebugModelLogSummary
    ExpenseBatchItemRequest:
      type: object
      properties:
        item_id:
          type: string
          description: The third-party item ID for this model in the bulk create request
        payload:
          $ref: '#/components/schemas/ExpenseRequest'
      required:
      - item_id
      - payload
      title: ExpenseBatchItemRequest
    Expense:
      type: object
