components:
  schemas:
    GroupsGetParametersExpandSchemaItems:
      type: string
      enum:
      - users
      title: GroupsGetParametersExpandSchemaItems
    PaginatedGroupList:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Group'
      title: PaginatedGroupList
    GroupsIdGetParametersExpandSchemaItems:
      type: string
      enum:
      - users
      title: GroupsIdGetParametersExpandSchemaItems
    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        remote_id:
          type:
          - string
          - 'null'
          description: The third-party API ID of the matching object.
        created_at:
          type: string
          format: date-time
          description: The datetime that this object was created by Merge.
        modified_at:
          type: string
          format: date-time
          description: The datetime that this object was modified by Merge.
        name:
          type:
          - string
          - 'null'
          description: The name of the Group
        users:
          type: array
          items:
            type: string
            format: uuid
        remote_created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the third party's group was created.
        remote_updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the third party's group was updated.
        remote_was_deleted:
          type: boolean
          description: Indicates whether or not this object has been deleted in the third party platform. Full coverage deletion detection is a premium add-on. Native deletion detection is offered for free with limited coverage. [Learn more](https://docs.merge.dev/integrations/hris/supported-features/).
        field_mappings:
          oneOf:
          - $ref: '#/components/schemas/GroupFieldMappings'
          - type: 'null'
        remote_data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RemoteData'
      description: '# The Group Object

        ### Description

        The `Group` object is used to represent any subset of `Users`.

        ### Usage Example

        Fetch from the `GET /api/chat/v1/groups` endpoint and view their groups.'
      title: Group
    RemoteData:
      type: object
      properties:
        path:
          type: string
          description: The third-party API path that is being called.
        data:
          description: The data returned from the third-party for this object in its original, unnormalized format.
      required:
      - path
      description: '# The RemoteData Object

        ### Description

        The `RemoteData` object is used to represent the full data pulled from the third-party API for an object.


