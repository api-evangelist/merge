          - array
          - 'null'
          items:
            type: string
          description: The candidate's locations.
        phone_numbers:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumber'
        email_addresses:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
        urls:
