      - string
      - number
      - date
      - datetime
      - bool
      - list
      title: ItemFormatEnum
    InvoiceBatchItemRequest:
      type: object
      properties:
        item_id:
          type: string
          description: The third-party item ID for this model in the bulk create request
        payload:
          $ref: '#/components/schemas/InvoiceRequest'
      required:
      - item_id
      - payload
      title: InvoiceBatchItemRequest
    FieldTypeEnum:
      type: string
      enum:
      - string
