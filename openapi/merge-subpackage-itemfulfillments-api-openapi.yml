components:
  schemas:
    ItemFulfillmentBatchItemRequest:
      type: object
      properties:
        item_id:
          type: string
          description: The third-party item ID for this model in the bulk create request
        payload:
          $ref: '#/components/schemas/ItemFulfillmentRequestRequest'
      required:
      - item_id
      - payload
      title: ItemFulfillmentBatchItemRequest
    ItemFulfillment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        remote_id:
          type:
          - string
          - 'null'
          description: The third-party API ID of the matching object.
        created_at:
          type: string
          format: date-time
          description: The datetime that this object was created by Merge.
        modified_at:
          type: string
          format: date-time
          description: The datetime that this object was modified by Merge.
        sales_order:
          type:
          - string
          - 'null'
          format: uuid
          description: The ID of the sales order that the item fulfillment originated from.
        fulfillment_date:
          type:
          - string
          - 'null'
          format: date-time
          description: The date the fulfillment was created.
        customer:
          type:
          - string
          - 'null'
          format: uuid
          description: The customer associated with the item fulfillment.
        company:
          type:
          - string
          - 'null'
          format: uuid
          description: The subsidiary associated with the fulfillment.
        status:
          oneOf:
          - $ref: '#/components/schemas/ItemFulfillmentStatusEnum'
          - type: 'null'
          description: The status of the item fulfillment.
        memo:
          type:
          - string
          - 'null'
          description: Comment attached to the fulfillment.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ItemFulfillmentLine'
        remote_created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the third party's item fulfillment was created.
        remote_updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the third party's item fulfillment was updated.
        remote_was_deleted:
          type: boolean
          description: Indicates whether or not this object has been deleted in the third party platform. Full coverage deletion detection is a premium add-on. Native deletion detection is offered for free with limited coverage. [Learn more](https://docs.merge.dev/integrations/hris/supported-features/).
        field_mappings:
          oneOf:
          - $ref: '#/components/schemas/ItemFulfillmentFieldMappings'
          - type: 'null'
        remote_data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RemoteData'
        remote_fields:
          type: array
          items:
            $ref: '#/components/schemas/RemoteField'
      description: '# The ItemFulfillment Object

        ### Description

        The `ItemFulfillment` object represents the recorded shipment or delivery of some or all items on an associated sales order.


        ### Usage Example

        Fetch from the `LIST ItemFulfillments` endpoint and view a company''s item fulfillments.'
      title: ItemFulfillment
    ValidationProblemSource:
      type: object
      properties:
        pointer:
          type: string
      required:
      - pointer
      title: ValidationProblemSource
    ItemFulfillmentStatusEnum:
      type: string
      enum:
      - DRAFT
      - IN_PROGRESS
      - SHIPPED
      - CANCELLED
      title: ItemFulfillmentStatusEnum
    AsyncBulkCreateResponse:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
          description: The ID of the batch.
      required:
      - batch_id
      description: Response serializer for POST bulk create - returns only batch_id
      title: AsyncBulkCreateResponse
    ItemFulfillmentLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        remote_id:
          type:
          - string
          - 'null'
          description: The third-party API ID of the matching object.
        created_at:
          type: string
          format: date-time
          description: The datetime that this object was created by Merge.
        modified_at:
          type: string
          format: date-time
          description: The datetime that this object was modified by Merge.
        item:
          type:
          - string
          - 'null'
          format: uuid
        sales_order_line:
          type:
          - string
          - 'null'
          format: uuid
        quantity:
          type:
          - string
          - 'null'
          format: decimal
          description: The amount of item being delivered.
        tracking_categories:
          type: array
          items:
            type: string
            format: uuid
          description: The dimensions or classification tags.
        remote_created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the third party's item fulfillment line item was created.
        remote_updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the third party's item fulfillment line item was updated.
        remote_was_deleted:
          type: boolean
          description: Indicates whether or not this object has been deleted in the third party platform. Full coverage deletion detection is a premium add-on. Native deletion detection is offered for free with limited coverage. [Learn more](https://docs.merge.dev/integrations/hris/supported-features/).
        remote_fields:
          type: array
          items:
            $ref: '#/components/schemas/RemoteField'
      description: '# The ItemFulfillmentLine Object

        ### Description

        The `ItemFulfillmentLine` object represents the specific quantity of a particular product or service that has actually been shipped or delivered against its corresponding order line.


        ### Usage Example

        Fetch from the `GET ItemFulfillment` endpoint and view a company''s item fulfillment lines.'
      title: ItemFulfillmentLine
    ItemTypeEnum:
      type: string
      enum:
