components:
  schemas:
    PatchedOpportunityRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: The opportunity's name.
        description:
          type:
          - string
          - 'null'
          description: The opportunity's description.
        amount:
          type:
          - integer
          - 'null'
          description: The opportunity's amount.
        owner:
          type:
          - string
          - 'null'
          format: uuid
          description: The opportunity's owner.
        account:
          type:
          - string
          - 'null'
          format: uuid
          description: The account of the opportunity.
        stage:
          type:
          - string
          - 'null'
          format: uuid
          description: The stage of the opportunity.
        status:
          oneOf:
          - $ref: '#/components/schemas/OpportunityStatusEnum'
          - type: 'null'
          description: The opportunity's status.
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the opportunity's last activity occurred.
        close_date:
          type:
          - string
          - 'null'
          format: date-time
          description: When the opportunity was closed.
        opportunity_url:
          type:
          - string
          - 'null'
          format: uri
          description: The opportunity's URL in the remote system.
        integration_params:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
        linked_account_params:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
        remote_fields:
          type: array
          items:
            $ref: '#/components/schemas/RemoteFieldRequest'
      description: '# The Opportunity Object

        ### Description

        The `Opportunity` object is used to represent a deal opportunity in a CRM system.

        ### Usage Example

        TODO'
