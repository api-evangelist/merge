paths:
  /crm/v1/opportunities:
    get:
      operationId: list
      summary: List
      description: Returns a list of `Opportunity` objects.{/* BEGIN_CRM_OPPORTUNITY_FETCH_SUPPORTED_FIELDS */}<Footer><MergeSupportedFieldsByIntegrationWidget requestType="GET" data="" /></Footer>{/* END_CRM_OPPORTUNITY_FETCH_SUPPORTED_FIELDS */}
