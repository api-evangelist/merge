      - method
      - status_code
      title: DebugModelLogSummary
    OpportunitiesIdGetParametersRemoteFields:
      type: string
      enum:
      - status
      title: OpportunitiesIdGetParametersRemoteFields
    OpportunitiesIdGetParametersExpandSchemaItems:
      type: string
      enum:
      - account
      - owner
      - stage
      title: OpportunitiesIdGetParametersExpandSchemaItems
    OpportunityResponse:
