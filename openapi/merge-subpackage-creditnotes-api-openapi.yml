          - string
          - 'null'
          format: decimal
          description: The credit note's exchange rate.
        total_amount:
          type:
          - number
          - 'null'
          format: double
          description: The credit note's total amount.
        remaining_credit:
          type:
          - number
          - 'null'
          format: double
