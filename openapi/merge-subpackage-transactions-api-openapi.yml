        item:
          type:
          - string
          - 'null'
          format: uuid
        account:
          type:
          - string
          - 'null'
          format: uuid
          description: The line item's account.
        tracking_category:
          type:
          - string
          - 'null'
          format: uuid
          description: The line's associated tracking category.
        tracking_categories:
          type: array
          items:
            type: string
            format: uuid
          description: The transaction line item's associated tracking categories.
        total_line_amount:
          type:
          - string
          - 'null'
          format: decimal
          description: The line item's total.
        tax_rate:
          type:
