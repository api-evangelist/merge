openapi: 3.2.0
info:
  title: Accounting Subpackage Bank Feed Accounts API
  version: 1.0.0
servers:
- url: https://api.merge.dev/api
- url: https://api-eu.merge.dev/api
- url: https://api-ap.merge.dev/api
tags:
- name: subpackage_bankFeedAccounts
paths:
  /accounting/v1/bank-feed-accounts:
    get:
      operationId: list
      summary: List
      description: Returns a list of `BankFeedAccount` objects.{/* BEGIN_ACCOUNTING_BANKFEEDACCOUNT_FETCH_SUPPORTED_FIELDS */}<Footer><MergeSupportedFieldsByIntegrationWidget requestType="GET" data="" /></Footer>{/* END_ACCOUNTING_BANKFEEDACCOUNT_FETCH_SUPPORTED_FIELDS */}
      tags:
      - subpackage_bankFeedAccounts
      parameters:
      - name: cursor
        in: query
        description: The pagination cursor value.
        required: false
        schema:
          type: string
      - name: include_deleted_data
        in: query
        description: Indicates whether or not this object has been deleted in the third party platform. Full coverage deletion detection is a premium add-on. Native deletion detection is offered for free with limited coverage. [Learn more](https://docs.merge.dev/integrations/hris/supported-features/).
        required: false
        schema:
          type: boolean
      - name: include_remote_data
        in: query
        description: Whether to include the original data Merge fetched from the third-party to produce these models.
        required: false
        schema:
          type: boolean
      - name: include_shell_data
        in: query
        description: Whether to include shell records. Shell records are empty records (they may contain some metadata but all other fields are null).
        required: false
        schema:
          type: boolean
      - name: page_size
        in: query
        description: Number of results to return per page. The maximum limit is 100.
        required: false
        schema:
          type: integer
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      - name: X-Account-Token
        in: header
        description: Token identifying the end user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBankFeedAccountList'
    post:
      operationId: create
      summary: Create
      description: Creates a `BankFeedAccount` object with the given values.{/* BEGIN_ACCOUNTING_BANKFEEDACCOUNT_CREATE_SUPPORTED_FIELDS */}<Footer><MergeSupportedFieldsByIntegrationWidget requestType="POST" data="" /></Footer>{/* END_ACCOUNTING_BANKFEEDACCOUNT_CREATE_SUPPORTED_FIELDS */}
      tags:
      - subpackage_bankFeedAccounts
      parameters:
      - name: is_debug_mode
        in: query
        description: Whether to include debug fields (such as log file links) in the response.
        required: false
        schema:
          type: boolean
      - name: run_async
        in: query
        description: Whether or not third-party updates should be run asynchronously.
        required: false
        schema:
          type: boolean
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      - name: X-Account-Token
        in: header
        description: Token identifying the end user.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankFeedAccountResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankFeedAccountEndpointRequest'
  /accounting/v1/bank-feed-accounts/{id}:
    get:
      operationId: retrieve
      summary: Retrieve
      description: Returns a `BankFeedAccount` object with the given `id`.{/* BEGIN_ACCOUNTING_BANKFEEDACCOUNT_FETCH_SUPPORTED_FIELDS */}<Footer><MergeSupportedFieldsByIntegrationWidget requestType="GET" data="" /></Footer>{/* END_ACCOUNTING_BANKFEEDACCOUNT_FETCH_SUPPORTED_FIELDS */}
      tags:
      - subpackage_bankFeedAccounts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: include_remote_data
        in: query
        description: Whether to include the original data Merge fetched from the third-party to produce these models.
        required: false
        schema:
          type: boolean
      - name: include_shell_data
        in: query
        description: Whether to include shell records. Shell records are empty records (they may contain some metadata but all other fields are null).
        required: false
        schema:
          type: boolean
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      - name: X-Account-Token
        in: header
        description: Token identifying the end user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankFeedAccount'
  /accounting/v1/bank-feed-accounts/meta/post:
    get:
      operationId: meta-post-retrieve
      summary: Meta Post Retrieve
      description: Returns metadata for `BankFeedAccount` POSTs.{/* BEGIN_ACCOUNTING_BANKFEEDACCOUNT_FETCH_SUPPORTED_FIELDS */}<Footer><MergeSupportedFieldsByIntegrationWidget requestType="GET" data="" /></Footer>{/* END_ACCOUNTING_BANKFEEDACCOUNT_FETCH_SUPPORTED_FIELDS */}
      tags:
      - subpackage_bankFeedAccounts
      parameters:
      - name: Authorization
        in: header
        description: Token-based authentication with required prefix "Bearer"
        required: true
        schema:
          type: string
      - name: X-Account-Token
        in: header
        description: Token identifying the end user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
components:
  schemas:
    DebugModelLogSummary:
      type: object
      properties:
        url:
          type: string
        method:
          type: string
        status_code:
          type: integer
      required:
      - url
      - method
      - status_code
      title: DebugModelLogSummary
    BankFeedAccountRequest:
      type: object
      properties:
        source_account_id:
          type:
          - string
          - 'null'
          description: The unique identifier of the source account from our customer’s platform.
        target_account_id:
          type:
          - string
          - 'null'
          description: The unique identifier of the target account from the third party software.
        source_account_name:
          type:
          - string
          - 'null'
          description: The name of the source account as stored in our customer’s platform.
        source_account_number:
          type:
          - string
          - 'null'
          description: The human-readable account number of the source account as stored in our customer’s platform.
        target_account_name:
          type:
          - string
          - 'null'
          description: The name of the target account from the third party software.
        currency:
          oneOf:
          - $ref: '#/components/schemas/TransactionCurrencyEnum'
          - type: 'null'
          description: The currency code of the bank feed. The currency code in ISO 4217 format.
        feed_status:
          oneOf:
          - $ref: '#/components/schemas/FeedStatusEnum'
          - type: 'null'
          description: The status of the bank feed.
        feed_start_date:
          type:
          - string
          - 'null'
          format: date-time
          description: The start date of the bank feed’s transactions.
        source_account_balance:
          type:
          - number
          - 'null'
          format: double
          description: The current balance of funds in the source account.
        account_type:
          oneOf:
          - $ref: '#/components/schemas/BankFeedAccountAccountTypeEnum'
          - type: 'null'
          description: The type of the account.
        integration_params:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
        linked_account_params:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
      description: '# The BankFeedAccount Object

        ### Description

        The `BankFeedAccount` object represents a bank feed account, detailing various attributes including account identifiers, names, currency, and balance information. This object is central to managing and tracking bank feed accounts within the system.


        ### Usage Example

        Fetch from the `GET BankFeedAccount` endpoint to view details of a bank feed account.'
      title: BankFeedAccountRequest
