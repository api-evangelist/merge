components:
  schemas:
    VendorCreditFieldMappings:
      type: object
      properties:
        organization_defined_targets:
          type: object
          additionalProperties:
            description: Any type
        linked_account_defined_targets:
          type: object
          additionalProperties:
            description: Any type
      title: VendorCreditFieldMappings
    VendorCreditRequest:
      type: object
      properties:
        number:
          type:
          - string
          - 'null'
          description: The vendor credit's number.
        transaction_date:
          type:
          - string
          - 'null'
          format: date-time
          description: The vendor credit's transaction date.
        vendor:
          type:
          - string
          - 'null'
          format: uuid
          description: The vendor that owes the gift or refund.
        total_amount:
          type:
          - number
          - 'null'
          format: double
          description: The vendor credit's total amount.
        currency:
          oneOf:
          - $ref: '#/components/schemas/TransactionCurrencyEnum'
          - type: 'null'
          description: The vendor credit's currency. The currency code in ISO 4217 format.
        exchange_rate:
          type:
          - string
          - 'null'
          format: decimal
          description: The vendor credit's exchange rate.
        inclusive_of_tax:
          type:
          - boolean
          - 'null'
          description: If the transaction is inclusive or exclusive of tax. `True` if inclusive, `False` if exclusive.
        company:
          type:
          - string
          - 'null'
          format: uuid
          description: The company the vendor credit belongs to.
        tracking_categories:
          type: array
          items:
            type: string
            format: uuid
        applied_to_lines:
          type: array
          items:
            $ref: '#/components/schemas/VendorCreditApplyLineForVendorCreditRequest'
          description: A list of VendorCredit Applied to Lines objects.
        accounting_period:
          type:
          - string
          - 'null'
          format: uuid
          description: The accounting period that the VendorCredit was generated in.
        integration_params:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
        linked_account_params:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
      description: '# The VendorCredit Object

        ### Description

        A `VendorCredit` is transaction issued by a vendor to the accounting company, indicating a reduction or cancellation of the amount owed to the vendor. It is most generally used as an adjustment note used to rectify errors, returns, or overpayments related to a purchasing transaction. A `VendorCredit` can be applied to `Accounts Payable` Invoices to decrease the overall amount of the `Invoice`.


        ### Usage Example

        Fetch from the `GET VendorCredit` endpoint and view a company''s vendor credits.'
      title: VendorCreditRequest
    ValidationProblemSource:
      type: object
      properties:
        pointer:
          type: string
      required:
      - pointer
      title: ValidationProblemSource
    PatchedVendorCreditEndpointRequest:
      type: object
      properties:
        model:
          $ref: '#/components/schemas/PatchedVendorCreditRequest'
      required:
      - model
      title: PatchedVendorCreditEndpointRequest
    VendorCreditApplyLineForVendorCredit:
      type: object
      properties:
        remote_id:
          type:
          - string
          - 'null'
          description: The third-party API ID of the matching object.
        created_at:
          type: string
          format: date-time
          description: The datetime that this object was created by Merge.
        modified_at:
          type: string
          format: date-time
          description: The datetime that this object was modified by Merge.
        invoice:
          type:
          - string
          - 'null'
          format: uuid
        applied_date:
          type:
          - string
          - 'null'
          format: date-time
          description: Date that the vendor credit is applied to the invoice.
        applied_amount:
          type:
          - string
          - 'null'
          format: decimal
          description: The amount of the VendorCredit applied to the invoice.
        remote_was_deleted:
          type: boolean
          description: Indicates whether or not this object has been deleted in the third party platform. Full coverage deletion detection is a premium add-on. Native deletion detection is offered for free with limited coverage. [Learn more](https://docs.merge.dev/integrations/hris/supported-features/).
      description: '# The VendorCreditApplyLine Object

        ### Description

        The `VendorCreditApplyLine` object is used to represent a applied vendor credit.


        ### Usage Example

        Fetch from the `GET VendorCredit` endpoint and view the vendor credit''s applied to lines.'
      title: VendorCreditApplyLineForVendorCredit
    PaginatedVendorCreditList:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/VendorCredit'
      title: PaginatedVendorCreditList
    VendorCreditsGetParametersExpandSchemaItems:
      type: string
      enum:
      - accounting_period
      - company
      - lines
      - tracking_categories
      - vendor
      title: VendorCreditsGetParametersExpandSchemaItems
    DebugModelLogSummary:
      type: object
      properties:
        url:
          type: string
        method:
          type: string
        status_code:
          type: integer
      required:
      - url
      - method
      - status_code
      title: DebugModelLogSummary
    VendorCreditLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        remote_id:
          type:
          - string
          - 'null'
          description: The third-party API ID of the matching object.
        created_at:
          type: string
          format: date-time
          description: The datetime that this object was created by Merge.
        modified_at:
          type: string
          format: date-time
          description: The datetime that this object was modified by Merge.
        net_amount:
          type:
          - number
          - 'null'
          format: double
          description: The full value of the credit.
        tracking_category:
          type:
          - string
          - 'null'
          format: uuid
          description: The line's associated tracking category.
        tracking_categories:
          type: array
          items:
            type: string
            format: uuid
          description: The vendor credit line item's associated tracking categories.
        description:
          type:
          - string
          - 'null'
          description: The line's description.
        account:
          type:
          - string
          - 'null'
          format: uuid
          description: The line's account.
        company:
          type:
          - string
          - 'null'
          format: uuid
          description: The company the line belongs to.
        project:
          type:
          - string
          - 'null'
          format: uuid
        contact:
          type:
          - string
          - 'null'
          format: uuid
        tax_rate:
          type:
          - string
          - 'null'
          format: uuid
          description: The tax rate that applies to this line item.
        exchange_rate:
          type:
          - string
          - 'null'
          format: decimal
          description: The vendor credit line item's exchange rate.
        remote_was_deleted:
          type: boolean
          description: Indicates whether or not this object has been deleted in the third party platform. Full coverage deletion detection is a premium add-on. Native deletion detection is offered for free with limited coverage. [Learn more](https://docs.merge.dev/integrations/hris/supported-features/).
      description: '# The VendorCreditLine Object

        ### Description

        The `VendorCreditLine` object is used to represent a vendor credit''s line items.


        ### Usage Example

        Fetch from the `GET VendorCredit` endpoint and view the vendor credit''s line items.'
      title: VendorCreditLine
