              schema:
                $ref: '#/components/schemas/PaginatedJobInterviewStageList'
  /ats/v1/job-interview-stages/{id}:
    get:
      operationId: retrieve
      summary: Retrieve
      description: Returns a `JobInterviewStage` object with the given `id`.{/* BEGIN_ATS_JOBINTERVIEWSTAGE_FETCH_SUPPORTED_FIELDS */}<Footer><MergeSupportedFieldsByIntegrationWidget requestType="GET" data="" /></Footer>{/* END_ATS_JOBINTERVIEWSTAGE_FETCH_SUPPORTED_FIELDS */}
      tags:
      - subpackage_jobInterviewStages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expand
        in: query
        description: Which relations should be returned in expanded form. Multiple relation names should be comma separated without spaces.
        required: false
        schema:
          type: array
          items:
