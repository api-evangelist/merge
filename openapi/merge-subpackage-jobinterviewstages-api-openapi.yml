paths:
  /ats/v1/job-interview-stages:
    get:
      operationId: list
      summary: List
      description: Returns a list of `JobInterviewStage` objects.{/* BEGIN_ATS_JOBINTERVIEWSTAGE_FETCH_SUPPORTED_FIELDS */}<Footer><MergeSupportedFieldsByIntegrationWidget requestType="GET" data="" /></Footer>{/* END_ATS_JOBINTERVIEWSTAGE_FETCH_SUPPORTED_FIELDS */}
